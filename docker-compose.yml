services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Inside the compose network the DB is reachable at the `db` service
      # name, not `localhost` — `.env`'s DATABASE_URL uses `localhost:<DB_HOST_PORT>`
      # for host-side tooling (psql, prisma CLI), which only resolves on the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-dkas_backend}
    volumes:
      # Uploaded images (src/storage/LocalStorageService) — without this,
      # every `docker compose up -d --build` recreates the container and
      # wipes anything written to /app/uploads.
      - dkas_backend_uploads:/app/uploads
    ports:
      - "${API_HOST_PORT:-32414}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/auth/session').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dkas_backend}
    volumes:
      - dkas_backend_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-23436}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dkas_backend_pgdata:
  dkas_backend_uploads:
