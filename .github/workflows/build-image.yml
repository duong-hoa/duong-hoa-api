name: Promote approved Dương Hòa MCP image
on:
  workflow_dispatch:
    inputs:
      publish_production:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  promote:
    if: ${{ inputs.publish_production == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the exact successful main build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/duong-hoa/duong-hoa-api/actions/runs/44863856163 --jq '.head_sha')" = '4ccddb5cd2234129bcd4bd56e9fe6f105b3a9957'
          test "$(gh api repos/duong-hoa/duong-hoa-api/actions/runs/44863856163 --jq '.head_branch')" = 'main'
          test "$(gh api repos/duong-hoa/duong-hoa-api/actions/runs/44863856163 --jq '.conclusion')" = 'success'
          test "$(gh api repos/duong-hoa/duong-hoa-api/git/ref/heads/main --jq '.object.sha')" = '4ccddb5cd2234129bcd4bd56e9fe6f105b3a9957'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified digest without rebuilding
        run: |
          set -euo pipefail
          image=ghcr.io/duong-hoa/duong-hoa-api
          digest=sha256:58de8977048b4e34a843977add7abc2b83c252c12d8d5f78497ce77f9dce68e9
          docker buildx imagetools create --prefer-index=false --tag "$image:prod" "$image@$digest"
          actual="$(docker buildx imagetools inspect "$image:prod" | awk '/^Digest:/ {print $2; exit}')"
          test "$actual" = "$digest"
          echo "$image@$actual" >> "$GITHUB_STEP_SUMMARY"
