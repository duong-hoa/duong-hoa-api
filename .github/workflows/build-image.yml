name: Build image (manual test)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in (
              "sub",
              "aud",
              "repository",
              "ref",
              "workflow",
              "job_workflow_ref",
              "event_name",
              "environment",
          ):
              if key in claims:
                  print(f"{key}={claims[key]}")
          PY

      - name: Load registry credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 5cdb51d6-ad70-48d1-a8fd-48761620a6b7
          domain: https://infisical.vrtour.vn
          project-slug: duong-hoa
          env-slug: prod
          secret-path: /registry
          include-imports: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.vrtour.vn
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.vrtour.vn/admin/duong-hoa-api:gha-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
