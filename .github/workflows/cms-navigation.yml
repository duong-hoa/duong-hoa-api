name: Verify CMS navigation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - '.github/workflows/cms-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: page_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d page_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:55432/page_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc -p tsconfig.json --incremental false
      - run: node test/block-navigation.integration.cjs
      - run: node test/cms-links.integration.cjs
      - run: node test/translate-block-content.cjs
      - run: node test/localize-fallback.cjs
